name: "Task"
description: "문서, 환경 설정 및 기타 작업을 수행합니다."
title: "[TASK] "
labels: ["chore"]

body:
  - type: dropdown
    id: category
    attributes:
      label: 작업 유형
      options:
        - Documentation
        - Configuration
        - CI/CD
        - Test
        - Infrastructure
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 작업 설명
      description: 수행할 작업의 목적을 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 작업 목록
      placeholder: |
        - [ ] 작업 1
        - [ ] 작업 2
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 참고 자료