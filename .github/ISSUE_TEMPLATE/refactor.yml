name: "Refactor"
description: "기존 코드의 구조 및 품질을 개선합니다."
title: "[REFACTOR] "
labels: ["refactor"]

body:
  - type: textarea
    id: problem
    attributes:
      label: 기존 코드의 문제점
      description: 리팩토링이 필요한 이유를 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: improvement
    attributes:
      label: 개선 방향
      description: 어떤 방식으로 개선할 것인지 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 작업 목록
      placeholder: |
        - [ ] 중복 코드 제거
        - [ ] 함수 분리
        - [ ] 기존 기능 테스트
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 영향 범위
      description: 영향을 받을 수 있는 기능을 작성해주세요.