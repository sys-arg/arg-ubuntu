name: "Bug Report"
description: "발견된 버그를 보고하고 수정합니다."
title: "[FIX] "
labels: ["bug"]

body:
  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 어떤 문제가 발생했는지 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      placeholder: |
        1. 로그인 페이지 접속
        2. 이메일과 비밀번호 입력
        3. 로그인 버튼 클릭
        4. 오류 발생
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 정상적으로 어떻게 동작해야 하는지 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 현재 어떻게 동작하는지 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      placeholder: OS, 브라우저, 실행 환경 등

  - type: textarea
    id: logs
    attributes:
      label: 로그 및 스크린샷
      description: 관련 오류 로그 또는 이미지를 첨부해주세요.