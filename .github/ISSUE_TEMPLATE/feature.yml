name: "Feature"
description: "새로운 기능을 개발합니다."
title: "[FEAT] "
labels: ["feature"]

body:
  - type: textarea
    id: description
    attributes:
      label: 기능 설명
      description: 어떤 기능을 개발하는지 설명해주세요.
      placeholder: 사용자가 이메일로 로그인할 수 있는 기능
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 작업 목록
      description: 세부 작업 내용을 작성해주세요.
      placeholder: |
        - [ ] 로그인 화면 구현
        - [ ] 로그인 API 연동
        - [ ] 예외 처리
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 완료 조건
      description: 어떤 조건을 만족해야 작업이 완료되는지 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 관련 문서, 디자인, 링크 등을 첨부해주세요.
    validations:
      required: false